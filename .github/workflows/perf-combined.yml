name: perf-combined

on:
  workflow_dispatch: {}

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run JMeter
        env:
          PERF_BASE_URL: ${{ secrets.PERF_BASE_URL }}
        run: |
          docker run --rm -v ${{ github.workspace }}/scripts/jmeter:/test -w /test justb4/jmeter:5.4.1 -n -t test-plan.jmx -l results.jtl -JBASE_URL=${PERF_BASE_URL}
          docker run --rm -v ${{ github.workspace }}/scripts/jmeter:/test -w /test justb4/jmeter:5.4.1 -g results.jtl -o report
      - name: Run k6
        env:
          BASE_URL: ${{ secrets.PERF_BASE_URL }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/src -w /src grafana/k6 run --summary-export=./scripts/perf/k6-summary.json scripts/k6/basic-script.js
      - name: Summarize results
        run: |
          python3 scripts/perf/summarize.py --k6 ./scripts/perf/k6-summary.json --jmeter ./scripts/jmeter/report
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perf-summary
          path: |
            scripts/perf/summary.html
            scripts/jmeter/report
            scripts/perf/k6-summary.json
